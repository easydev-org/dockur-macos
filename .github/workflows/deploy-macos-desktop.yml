name: deploy-macos-desktop

# Turn a baked macOS disk into one that reaches the desktop, by driving Setup
# Assistant the way a person at the console would - then keep that disk.
#
# WHY DRIVING IT, AFTER ALL THE MARKER ATTEMPTS FAILED. The research settled the
# question of whether a cleaner mechanism exists: dockur's README states only
# dockur/windows has automatic installation, OSX-KVM (23.8k stars) lists
# "automate the macOS installation via OpenCV" under Contributing Back and tells
# users to sit at the Country Selection screen and wait, and the unattended code
# in this fork describes itself as "the unattended-install proof". Attempts made
# here that did not work: a marker written during the prepare phase (discarded
# when macOS rewrites the volume), skipsetup.pkg via --installpackage (lands where
# $3 points), a firstboot LaunchDaemon (runs too late), and a marker written
# offline from Recovery (repair reported success, and the country picker came back
# - because that path needs setup.dmg to exist, which the disk artifact does not
# carry, so launch.sh never ran the repair branch at all).
#
# Driving the guest needs none of that to be true. It presses keys, looks at the
# result, and keeps every frame so a partial run is diagnosable.
#
# Everything happens on the disk the last bake produced; nothing is reinstalled.

on:
  workflow_dispatch:
    inputs:
      golden_ref:
        description: "OCI ref of the golden disk (oras artifact in ghcr)"
        required: false
        default: "ghcr.io/easydev-org/golden-macos:14"
      launcher_image:
        description: "Launcher image to take qemu and the OpenCore assets from"
        required: false
        default: "ghcr.io/easydev-org/dockur-macos-launcher:14"
      artifact_run:
        description: "Fallback: run id holding macos-golden and macos-image-fixed"
        required: false
        default: ""
      publish_tag:
        description: "Tag to publish the driven disk under (empty = skip publishing)"
        required: false
        default: "desktop"
      want_ssh:
        description: "Also turn Remote Login on before publishing (stage 3). Off: the run stops at the desktop."
        required: false
        default: ""
      republish_from:
        description: "Run id whose macos-desktop-disk should be re-published, skipping the VM entirely"
        required: false
        default: ""

permissions:
  contents: read
  actions: read
  # packages: read is what allows pulling the golden disk and the launcher image
  # from ghcr with the workflow token. Without it the pull is denied and the
  # failure surfaces far from its cause: 'docker create' then reports
  # 'pull access denied for assets', which reads like a missing container name
  # rather than a permissions problem.
  packages: write
  # checks: write is what lets log-stream create and update the check run it
  # streams into. Without it the action answers:
  #   cannot create a check run (403): Resource not accessible by integration
  # and, correctly, carries on without streaming rather than failing the build.
  checks: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # No apt. Installing qemu-system-x86 from the Ubuntu archive took 1154
      # seconds on the last run - nineteen minutes of the whole job - and the
      # launcher image already contains a working qemu-system-x86_64 with its
      # firmware. qemu-utils is only needed for qemu-img, which is ~2 MB and
      # installs in seconds.
      #
      # The image is pulled after the disk step, because pulling 640 MB is faster
      # than what apt was doing, and the binary is copied out once it is here.
      - name: qemu-utils only
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-utils

      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h / | tail -1

      # Pull the disk from the registry, not from an Actions artifact.
      #
      # Measured on this repo for the same 11.8 GiB file: 1498 seconds as an
      # artifact (and once over 1085 without finishing), 333 seconds as an oras
      # pull from ghcr. The artifact path redirects to Azure blob storage and its
      # rate is not something a workflow can influence; the registry serves from a
      # CDN. ghcr is also where easysandbox-macos expects the golden disk to live,
      # so this is the production path rather than a shortcut around one.
      - name: pull the golden disk from ghcr
        if: github.event.inputs.artifact_run == ''
        run: |
          set -eux
          curl -sSL https://github.com/oras-project/oras/releases/download/v1.2.0/oras_1.2.0_linux_amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin oras
          oras version
          mkdir -p disk
          cd disk
          # Pull with retries, and with concurrency so the blob arrives in chunks
          # rather than one long-lived HTTP/2 stream. A single stream for 11 GiB
          # was interrupted mid-transfer:
          #   copy failed: stream error: stream ID 3; PROTOCOL_ERROR; received from peer
          # which is the registry closing a stalled stream, not an auth or missing
          # blob problem. --concurrency asks for the blob in parts.
          # Retries with a growing pause, and more parts per attempt.
          #
          # The driven disk is 12.8 GB and the single-stream transfer keeps dying:
          #   copy failed: stream error: stream ID 1; PROTOCOL_ERROR; received from peer
          # three attempts in a row on one run. That is the registry closing a stalled
          # stream, so more concurrency means each stream carries less and has less
          # chance to stall; the pause grows because immediate retries hit the same
          # wall. Eight attempts at concurrency 8 have been enough for this blob.
          ok=0
          for attempt in 1 2 3 4 5 6 7 8; do
            echo "=== oras pull attempt $attempt (concurrency 8) ==="
            if oras pull --concurrency 8 "${{ github.event.inputs.golden_ref }}"; then
              ok=1
              break
            fi
            # A partial file makes the next attempt fail differently; clear it.
            rm -f data.qcow2 data.txt macos-desktop.qcow2 desktop-disk.txt
            pause=$(( attempt * 15 ))
            echo "attempt $attempt failed; waiting ${pause}s"
            sleep "$pause"
          done
          [ "$ok" = "1" ] || { echo "::error::could not pull the golden disk after 8 attempts"; exit 1; }

          ls -la
          # Two naming conventions arrive here. The baked disk is published as
          # data.qcow2/data.txt; the driven desktop disk as
          # macos-desktop.qcow2/desktop-disk.txt, because the publish step uploads the
          # files by the names it has on disk. Both are normalised to data.qcow2 so
          # everything downstream - and the artifact fallback below - sees one name.
          #
          # This mismatch is what failed the first verification run: oras pulled
          # 12.8 GB correctly and then 'qemu-img info data.qcow2' said no such file,
          # because the file on disk was called macos-desktop.qcow2.
          if [ -s macos-desktop.qcow2 ]; then
            mv -f macos-desktop.qcow2 data.qcow2
            [ -s desktop-disk.txt ] && mv -f desktop-disk.txt data.txt
          fi
          qemu-img info data.qcow2
          cat data.txt 2>/dev/null || true

      # Fallback, for a disk that has not been published yet.
      - uses: actions/download-artifact@v4
        if: github.event.inputs.artifact_run != ''
        with:
          name: macos-golden
          path: disk
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.inputs.artifact_run }}

      - uses: actions/download-artifact@v4
        if: github.event.inputs.artifact_run != ''
        with:
          name: macos-image-fixed
          path: img
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.inputs.artifact_run }}

      # boot-golden.sh wants data.img, boot.img, macos.rom and macos.vars beside
      # each other. Only data.img survives in the artifact, so the firmware pair
      # and the OpenCore image are taken from the launcher image, which builds them
      # from the same assets the bake used.
      - name: assemble the vm directory
        id: vmimg
        run: |
          set -eux
          mkdir -p vm
          f=$(find disk -name '*.qcow2' | head -1)
          [ -n "$f" ] || { echo "no disk in the artifact"; ls -R disk | head; exit 1; }
          qemu-img info "$f"
          qemu-img convert -O raw "$f" vm/data.img
          du -h vm/data.img

          # The launcher image comes from the registry when the disk did, and from
          # the artifact tarball when that fallback is in use. Either way it is the
          # source of qemu, its libraries, and the OpenCore config the bake used.
          if [ -f img/image.tar ]; then
            docker load -i img/image.tar
            IMG=$(docker images --format '{{.Repository}}:{{.Tag}}' | grep -m1 dockur-macos-fixed)
          else
            IMG="${{ github.event.inputs.launcher_image }}"
            echo "${{ secrets.GITHUB_TOKEN }}" \
              | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker pull "$IMG"
          fi
          echo "launcher: $IMG"
          echo "image=$IMG" >> "$GITHUB_OUTPUT"
          # Fail here, not three steps later. When the image could not be pulled,
          # the next command that mentions 'assets' reports
          #   pull access denied for assets, repository does not exist
          # which points at the container name instead of the pull.
          docker rm -f assets >/dev/null 2>&1 || true
          if ! docker create --name assets "$IMG" >/dev/null; then
            echo "::error::could not create a container from $IMG - is it published and readable?"
            docker images | head -5
            exit 1
          fi
          # Whatever firmware and OpenCore image exist in the image are reused;
          # the bake wrote them next to the disk and they are not in the artifact.
          docker cp assets:/opencore/version ./oc-version 2>/dev/null || true

          # qemu is NOT copied out here any more. It runs inside this image in the
          # drive step, where every library it links against already exists -
          # copying the binary out was the source of the libcapstone and libjpeg
          # failures, and the docker cp of the OpenCore version above is all this
          # step needs from the image.
          cat oc-version 2>/dev/null || true
          ls -la vm/

      # A first boot of this disk produces the country picker; the firmware and
      # OpenCore image are regenerated by dockur on the fly, so the simplest way to
      # have them on disk is to let dockur create the container once and borrow its
      # /storage. That is what this step does, without installing anything: the
      # container is started and stopped as soon as the assets appear.
      - name: let dockur produce boot.img, macos.rom and macos.vars
        run: |
          set -eux
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

          mkdir -p storage/14
          # The disk goes where dockur looks for it, under the name it expects, so
          # dockur treats it as an existing system rather than building one.
          cp --sparse=always vm/data.img storage/14/data.img

          docker rm -f assetsrc || true
          docker run -d --name assetsrc \
            --device=/dev/kvm \
            -e VERSION=14 -e DISK_SIZE=64G -e RAM_SIZE=8G -e CPU_CORES=4 \
            -e MANUAL=Y \
            -v "$GITHUB_WORKSPACE/storage:/storage" \
            "${{ steps.vmimg.outputs.image }}"

          # boot.img, macos.rom and macos.vars appear within a minute; the guest
          # itself is not needed, so stop as soon as they are all present.
          for i in $(seq 1 40); do
            sleep 10
            if [ -s storage/14/boot.img ] && [ -s storage/14/macos.rom ] && [ -s storage/14/macos.vars ]; then
              echo "boot assets present after $((i*10))s"
              break
            fi
            echo "[$((i*10))s] waiting for boot assets"
          done
          docker logs --tail 20 assetsrc || true
          docker rm -f assetsrc || true

          ls -la storage/14/
          cp -f storage/14/boot.img vm/boot.img
          cp -f storage/14/macos.rom vm/macos.rom
          cp -f storage/14/macos.vars vm/macos.vars
          ls -la vm/

      # Streaming, so this step can be watched while it runs.
      #
      # GitHub serves a running job's Actions log from an internal store, and the
      # public endpoints answer 404 or 403 until the job finishes - measured
      # repeatedly in this repo, including 302 to a blob that did not exist yet.
      # A check run's output.text has no such restriction: a plain GET with a
      # token reads it live. log-stream keeps that field current every few
      # seconds, which turns a 20-minute blind wait into something observable.
      # Everything from here runs INSIDE the launcher image.
      #
      # This corrects a mistake that cost several rounds. Earlier versions copied
      # qemu-system-x86_64 out of the image and ran it on the runner, which then
      # failed one shared library at a time:
      #   libcapstone.so.5, then libjpeg.so.62, and libc queued behind them.
      # The image is a complete environment for exactly this binary; the runner is
      # not, and rebuilding that environment dependency by dependency was never
      # going to converge.
      #
      # The image is now used as intended: started with the disk bind-mounted and
      # --entrypoint replaced by a shell, so qemu finds every library it links
      # against. python3 is in the image too (its own patch.py needs it), so the
      # driver runs there as well and the runner needs no setup at all.
      - name: boot and drive Setup Assistant
        if: github.event.inputs.republish_from == ''
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: setup-assistant-drive-${{ github.event.inputs.publish_tag }}
          interval: "10"
          command: |
            set -eu
            IMG="${{ steps.vmimg.outputs.image }}"
            mkdir -p frames
            chmod 777 frames

            # OCR runs on this host, so it needs tools the launcher image does not
            # carry. tesseract is in OSX-KVM's own dependency list for exactly this
            # job, and reading the screen is what every coordinate guess here was
            # missing.
            sudo apt-get install -y -qq tesseract-ocr
            # Prove OCR works before the driver depends on it. A silent OCR failure
            # reads exactly like a blank screen, and that cost two runs.
            tesseract --version | head -1
            echo Continue > /tmp/ocrtest.txt
            sudo python3 -c "import subprocess; print(subprocess.run(['tesseract','/tmp/ocrtest.txt','stdout'],capture_output=True,text=True).stdout.strip())"

            # /dev/kvm exists on the runner but its group may not be applied yet.
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
            sudo udevadm control --reload-rules || true
            sudo udevadm trigger --name-match=kvm || true
            sudo chmod 666 /dev/kvm || true

            chmod +x scripts/drive-in-container.sh scripts/drive-ocr.py scripts/qmp.py scripts/ppm2png.py
            docker rm -f driver >/dev/null 2>&1 || true

            # qemu in the image, driver on this host, joined by the QMP socket that
            # the bind mount makes visible to both.
            docker run -d --name driver \
              --device=/dev/kvm \
              --entrypoint sh \
              -v "$GITHUB_WORKSPACE/vm:/vm" \
              -v "$GITHUB_WORKSPACE/frames:/frames" \
              -v "$GITHUB_WORKSPACE/scripts:/scripts:ro" \
              "$IMG" /scripts/drive-in-container.sh

            # Wait for qemu to create the socket, then drive it.
            for i in $(seq 1 40); do
              [ -S frames/monitor.sock.qmp ] && break
              sleep 5
              docker ps --filter name=driver --format '{{.Status}}' || true
            done
            ls -la frames/ || true

            # The socket is created by root inside the container, so connecting to
            # it needs the same side of the boundary: without this the driver dies
            # on PermissionError at connect(), having read nothing.
            # WANT_SSH is read by the driver. Unset means stage 2 only: drive the wizard to
            # the desktop and publish. Stage 3 sets it to 1 and turns Remote Login on
            # against a published desktop disk.
            sudo WANT_SSH="${{ github.event.inputs.want_ssh }}"               python3 scripts/drive-ocr.py "$GITHUB_WORKSPACE/frames/monitor.sock" "$GITHUB_WORKSPACE/frames/frame" || true
            sudo chown -R "$(id -u):$(id -g)" frames || true

            echo "=== frames ==="
            ls -la frames | tail -25 || true
            docker stop -t 30 driver >/dev/null 2>&1 || true

      # Re-publishing an existing disk to a new tag.
      #
      # The VM is skipped entirely in this mode (republish_from is set). Fetching a
      # 12 GB artifact and pushing it costs a few minutes; booting a guest to prove
      # what an earlier run already proved costs twenty-five. So when the disk is
      # known good, this is how it gets a second tag.
      - uses: actions/download-artifact@v4
        if: github.event.inputs.republish_from != ''
        with:
          name: macos-desktop-disk
          path: republished
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.inputs.republish_from }}

      - uses: actions/download-artifact@v4
        if: github.event.inputs.republish_from != ''
        with:
          name: deploy-frames
          path: republished/frames
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.inputs.republish_from }}

      - name: stage the re-published disk where the publish step expects it
        if: github.event.inputs.republish_from != ''
        run: |
          set -eux
          ls -la republished
          mv republished/macos-desktop.qcow2 ./macos-desktop.qcow2
          mkdir -p frames
          # The publish step's guard reads this file, so the earlier run's log travels
          # with its disk - the evidence for 'DESKTOP REACHED' and the ssh banner stays
          # attached to the artifact rather than being re-asserted here.
          cp republished/frames/frame-drive.log frames/frame-drive.log 2>/dev/null || true
          ls -la frames | head -5
          grep -c "DESKTOP REACHED" frames/frame-drive.log || true
          grep -o "SSH-SERVER-CONFIRMED.*" frames/frame-drive.log | head -1 || true

      # The disk is the deliverable: if the wizard was completed, this is a disk
      # that boots straight to a desktop.
      - name: convert the finished disk
        if: always() && github.event.inputs.republish_from == ''
        run: |
          set -eux
          sudo chown "$(id -u):$(id -g)" vm/data.img 2>/dev/null || true
          qemu-img convert -O qcow2 -c vm/data.img "$GITHUB_WORKSPACE/macos-desktop.qcow2" || true
          ls -la macos-desktop.qcow2 2>/dev/null || true
          qemu-img info macos-desktop.qcow2 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deploy-frames
          path: |
            # The container writes into frames/, which is the bind mount. The
            # earlier paths here said frame-* and matched nothing, so a run that
            # produced dozens of screenshots uploaded no screenshots at all.
            frames/**
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-desktop-disk
          path: macos-desktop.qcow2
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0

      # Publish the driven disk to the registry, so the next run can start from a
      # disk that already reaches the desktop instead of replaying Setup Assistant.
      #
      # This is the step that was missing. Until now every run pulled the original
      # bake disk, walked the whole wizard again - about fifteen minutes - just to
      # retry the ssh step, and threw the result away as an artifact. Publishing turns
      # that into: pull a desktop disk, boot it, done.
      #
      # Only published when the driver actually reported a desktop. A disk that
      # stopped at the account pane is not an appliance, and putting it in the
      # registry under a name that means "ready to boot" would be a lie that the next
      # run silently relies on.
      - name: publish the desktop disk to ghcr
        if: always()
        run: |
          set -eux
          TAG="${{ github.event.inputs.publish_tag }}"
          TAG="${TAG:-desktop}"
          echo "publishing under tag: $TAG"
          if ! grep -q "DESKTOP REACHED" frames/frame-drive.log 2>/dev/null; then
            echo "::warning::the driver never reported a desktop; not publishing"
            exit 0
          fi
          if [ ! -s macos-desktop.qcow2 ]; then
            echo "::warning::macos-desktop.qcow2 is missing; not publishing"
            exit 0
          fi

          # ssh counts as part of the deliverable only when the driver found sshd
          # answering on the forwarded port. Recording it in the metadata means a
          # consumer can tell whether the disk it pulled is ssh-ready, rather than
          # assuming every :desktop disk is.
          SSH_STATE="unknown"
          if grep -q "sshd confirmed - the port speaks the ssh protocol" frames/frame-drive.log 2>/dev/null; then
            SSH_STATE="verified: OpenSSH banner on the forwarded port, and a loopback login returned Darwin"
          elif grep -q "ssh probe: port 2222 accepts connections" frames/frame-drive.log 2>/dev/null; then
            SSH_STATE="port open, banner not confirmed"
          else
            SSH_STATE="not enabled in this run"
          fi
          echo "ssh: $SSH_STATE"

          curl -sSL https://github.com/oras-project/oras/releases/download/v1.2.0/oras_1.2.0_linux_amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin oras
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

          # The tag records what this disk is: driven to a desktop, on macOS 14.
          REF="ghcr.io/easydev-org/golden-macos:$TAG"
          {
            echo "source_run: ${{ github.run_id }}"
            echo "git_sha: ${{ github.sha }}"
            echo "driven_at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "desktop_reached: yes"
            echo "account: docker (created by the driver at the account pane)"
            echo "password: admin"
            echo "ssh: $SSH_STATE"
            echo "ssh_port_forward: 2222 -> guest 22"
            echo "--- qemu-img info ---"
            qemu-img info macos-desktop.qcow2
          } > desktop-disk.txt
          cat desktop-disk.txt

          oras push "$REF" \
            --artifact-type application/vnd.easydev.golden-disk.v1+qcow2 \
            --annotation "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --annotation "org.opencontainers.image.revision=${{ github.sha }}" \
            macos-desktop.qcow2:application/vnd.easydev.qcow2 \
            desktop-disk.txt:text/plain

          echo "=== published $REF ==="
