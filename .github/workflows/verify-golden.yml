name: verify-golden

# Boot the golden disk that build-with-fix produced and prove it reaches a
# desktop, without depending on the bake job that made it.
#
# Why a separate workflow: the previous run stopped the container inside its
# extract step, so the screenshot step afterwards had nothing to talk to
#   docker exec macbake ... -> Could not find the file /tmp/shot.ppm in container
# and the picture never happened. Booting the finished disk on its own is also
# the honest test: a golden disk is only worth shipping if it comes up by itself.
#
# What "installed" already tells us, from the bake log: storage settled at
# 27306 MiB after 3120 s, and qemu-img reported a 64 GiB virtual / 25.6 GiB real
# qcow2. What that does NOT tell us is whether firstboot runs, creates the
# account and reaches the desktop - which is exactly what this checks.

on:
  workflow_dispatch:
    inputs:
      artifact_run:
        description: "Run id that holds the macos-golden artifact"
        required: true
        default: "40185021642"
      artifact_name:
        description: "Artifact name holding the disk"
        required: false
        default: "macos-golden"
      wait:
        description: "Seconds to let the guest run before the screenshot"
        required: false
        default: "420"

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-utils
          qemu-img --version | head -1

      - name: free disk space
        run: |
          set -eux
          # The disk is 25.6 GiB; a stock runner cannot hold it beside its own
          # toolchains.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af || true
          df -h / | tail -1

      # Pull the disk from the run that baked it. download-artifact needs that
      # run's id, which is why the caller passes artifact_run.
      - uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.inputs.artifact_name }}
          path: disk
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.inputs.artifact_run }}

      - name: place the disk where dockur expects it
        run: |
          set -eux
          disk=$(find disk -name '*.qcow2' -type f | head -1)
          [ -n "$disk" ] || { echo "no qcow2 in the artifact"; find disk | head; exit 1; }
          ls -la "$disk"
          sudo chmod a+r "$disk"

          # dockur looks for its disk at /storage/<version>/data.img, and this
          # one is a qcow2 with a different name. Put it exactly where the
          # launcher searches, under the name it searches for.
          mkdir -p storage/14
          sudo cp --sparse=always "$disk" storage/14/data.img
          ls -la storage/14/
          du -h storage/14/data.img
          qemu-img info storage/14/data.img

      # Build the same image the bake used (patched Dockerfile), then boot the
      # golden disk with it. MANUAL=Y because nothing should install here - the
      # disk is already installed, and a manual-mode container leaves it alone.
      - name: build the launcher image
        id: img
        run: |
          set -eux
          python3 dockerfiles/patch_upstream.py Dockerfile
          img="macos-verify:${{ github.run_number }}"
          docker build -t "$img" .
          echo "image=$img" >> "$GITHUB_OUTPUT"

      - name: boot the golden disk
        run: |
          set -eux
          # MANUAL=Y so dockur treats this as "a disk already exists, just boot
          # it" rather than re-installing. NET_ADMIN+/dev/net/tun for a real
          # bridge: firstboot may want the network.
          docker run -d --name macverify \
            --device=/dev/kvm --device=/dev/net/tun --cap-add NET_ADMIN \
            -e VERSION=14 -e DISK_SIZE=64G -e RAM_SIZE=8G -e CPU_CORES=4 \
            -e MANUAL=Y \
            -v "$GITHUB_WORKSPACE/storage:/storage" \
            "${{ steps.img.outputs.image }}"
          sleep 30
          docker ps -a
          docker logs --tail 50 macverify || true

      - name: let it boot, then look at the screen
        run: |
          set -eux
          sleep "${{ github.event.inputs.wait }}"
          docker ps -a
          echo "=== container log ==="
          docker logs --tail 80 macverify || true

          # screendump through the monitor while the container is still up -
          # the mistake last time was taking the picture after stopping it.
          docker cp scripts/shotsock.py macverify:/tmp/shotsock.py
          docker exec macverify python3 /tmp/shotsock.py /run/shm/monitor.sock /tmp/shot.ppm || true
          docker cp macverify:/tmp/shot.ppm ./screen.ppm || true
          ls -la screen.ppm 2>/dev/null || echo "no screen.ppm"
          if [ -s screen.ppm ]; then python3 scripts/ppm2png.py screen.ppm screen.png || true; fi

      # A second look after more time: first boot does a lot (account creation,
      # Setup Assistant skip, login) and the first screenshot can catch it mid
      # way. Two pictures 5 minutes apart are far more informative than one.
      - name: second look after five more minutes
        if: always()
        run: |
          set -x
          sleep 300
          docker cp scripts/shotsock.py macverify:/tmp/shotsock.py 2>/dev/null || true
          docker exec macverify python3 /tmp/shotsock.py /run/shm/monitor.sock /tmp/shot2.ppm 2>/dev/null || true
          docker cp macverify:/tmp/shot2.ppm ./screen2.ppm 2>/dev/null || true
          if [ -s screen2.ppm ]; then python3 scripts/ppm2png.py screen2.ppm screen2.png || true; fi
          ls -la screen2.* 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-desktop
          path: |
            screen.png
            screen.ppm
            screen2.png
            screen2.ppm
          if-no-files-found: warn
          retention-days: 14

      - name: stop
        if: always()
        run: docker rm -f macverify || true
