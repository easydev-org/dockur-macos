name: capture

# Take a screenshot every 30 seconds and keep them all.
#
# Nothing else. No clicking, no OCR, no decisions - this exists to produce a record of
# what the guest actually shows over time, so a run can be understood afterwards instead
# of inferred from a driver's log lines.

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long to capture"
        required: false
        default: "25"

permissions:
  contents: read
  packages: read

jobs:
  # One job per version, all at once.
  #
  # Jobs without a `needs:` between them start together on separate runners - there is no
  # queue and no ordering. Nothing is shared here either: each job downloads its own
  # recovery image and boots its own guest, so 14, 15 and 26 can be photographed
  # simultaneously instead of one after another.
  #
  # fail-fast is off on purpose: 26 may fail where 15 succeeds, and a failure there must
  # not cancel the runs that would still produce useful frames.
  capture:
    strategy:
      fail-fast: false
      matrix:
        # A static list, not a split of the input string. GitHub's expression language
        # has no split, and building one with format/replace/fromJSON is fragile in
        # exactly the way this project has already been bitten by several times - it
        # fails at matrix-expansion time with an unhelpful message, before any step runs.
        # Comment a version out to leave it out.
        version:
          - "14"
          - "15"
          - "26"
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: tooling
        run: |
          set -eux
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-utils p7zip-full

      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune -af || true
          df -h / | tail -1

      - name: pull the launcher image
        run: |
          set -eux
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | sudo docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          sudo docker pull ghcr.io/easydev-org/dockur-macos-launcher:14
          sudo docker tag ghcr.io/easydev-org/dockur-macos-launcher:14 macos-cap

      # MANUAL=Y: the container prepares the recovery image, the disk and the OpenCore
      # assets, then boots Apple's installer. That is the state worth photographing.
      - name: start the guest
        run: |
          set -eux
          mkdir -p "$GITHUB_WORKSPACE/storage"
          sudo docker run -d --name cap \
            --device=/dev/kvm --device=/dev/net/tun --cap-add NET_ADMIN \
            -e VERSION=${{ matrix.version }} \
            -e DISK_SIZE=64G -e RAM_SIZE=8G -e CPU_CORES=4 \
            -e MANUAL=Y \
            -v "$GITHUB_WORKSPACE/storage:/storage" \
            -v "$GITHUB_WORKSPACE/scripts:/scripts:ro" \
            macos-cap
          sleep 30
          sudo docker logs --tail 30 cap || true

      # dockur's qemu has its own monitor at /run/shm/monitor.sock inside the container.
      # HMP speaks plain text, which is all screendump needs - no JSON, no handshake, so
      # none of the QMP plumbing this project spent so long on is involved.
      #
      # The loop runs on the runner and reaches into the container with docker exec.
      - name: capture a frame every 30 seconds
        timeout-minutes: 180
        run: |
          set -ux
          V="${{ matrix.version }}"
          TOTAL=$(( ${{ github.event.inputs.minutes }} * 60 ))
          mkdir -p shots
          chmod 777 shots

          # Wait for the monitor socket before the first frame; before it exists there is
          # simply nothing to photograph.
          for i in $(seq 1 120); do
            if sudo docker exec cap sh -c '[ -S /run/shm/monitor.sock ]' 2>/dev/null; then
              echo "monitor socket up after $((i*5))s"
              break
            fi
            sleep 5
          done

          elapsed=0
          n=0
          same=0
          while [ "$elapsed" -lt "$TOTAL" ]; do
            n=$((n + 1))
            name=$(printf 'shot-%03d-t%04ds' "$n" "$elapsed")

            # screendump writes inside the container; read it back out immediately,
            # because /tmp there disappears with the container.
            sudo docker exec cap python3 /scripts/shot.py "/tmp/$name.ppm" \
              >/dev/null 2>&1 || echo "$name: monitor write failed"

            sleep 2
            sudo docker cp "cap:/tmp/$name.ppm" "shots/$name.ppm" 2>/dev/null || \
              echo "$name: nothing captured"

            # Record what the container is doing at this moment as well: when the guest is
            # on a black screen, the log is the only thing that says why.
            sudo docker logs --tail 3 cap >>"shots/$name.log" 2>&1 || true

            # Stop once the screen stops changing.
            #
            # The artifact can only be downloaded after the job ends, so a run that keeps
            # photographing an unchanging screen costs minutes and adds nothing. Four
            # identical frames in a row is two minutes of the same picture: by then the
            # guest has settled and the last frame IS the answer.
            prev=$(ls shots/*.ppm 2>/dev/null | tail -2 | head -1)
            cur=$(ls shots/*.ppm 2>/dev/null | tail -1)
            if [ -n "$prev" ] && [ -n "$cur" ] && cmp -s "$prev" "$cur"; then
              same=$((same + 1))
              echo "$cur is identical to the previous frame ($same in a row)"
              if [ "$same" -ge 4 ]; then
                echo "screen unchanged for $((same * 30))s; stopping capture early"
                break
              fi
            else
              same=0
            fi

            sleep 28
            elapsed=$((elapsed + 30))
          done

          ls shots | head -5
          ls shots | wc -l

      # PPM is uncompressed at 6 MB a frame. Converting to PNG makes the artifact a few
      # hundred KB and readable without special tooling.
      - name: convert to png
        if: always()
        run: |
          set -ux
          sudo apt-get install -y -qq imagemagick || true
          for f in shots/*.ppm; do
            [ -s "$f" ] || continue
            convert "$f" "${f%.ppm}.png" 2>/dev/null || \
              python3 scripts/ppm2png.py "$f" "${f%.ppm}.png" || true
          done
          ls -la shots | head -10

      - name: keep every frame
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capture-${{ matrix.version }}
          path: |
            shots/**
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0

      - name: stop
        if: always()
        run: |
          sudo docker logs cap > shots-container.log 2>&1 || true
          tail -40 shots-container.log || true
          sudo docker rm -f cap >/dev/null 2>&1 || true

      - name: keep the container log too
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capture-log
          path: shots-container.log
          if-no-files-found: warn
          retention-days: 14
