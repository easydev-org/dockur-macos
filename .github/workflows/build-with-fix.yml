name: build-with-fix

# Build dockur/macos against qemux/qemu:7.50 - the base upstream pins - by
# working around the one line that cannot work, then verify the unattended code
# is actually inside the result.
#
# Established in CI by diagnose-build:
#   exclude  FAIL  failed to calculate checksum ... "/etc/alternatives/awk.1.gz"
#   repair   FAIL  deleting the dangling link first does not help
#   plain    OK    COPY the whole tree, then rm the binary in the same layer
#   rsync    OK    tar inside the source container, untar into scratch
#
# plain is the smaller change and leaves no extra bytes (COPY and RUN land in
# the same layer), so that is what patch_upstream.py applies.

on:
  workflow_dispatch:
    inputs:
      run_bake:
        description: "Also attempt a macOS install with the built image"
        type: boolean
        required: false
        default: false
      macos_version:
        description: "macOS version to install (14, 15, 26)"
        required: false
        default: "14"
      manual_install:
        description: "Drive the installer with OCR instead of the unattended rc.cdrom patch (needed for 15 and 26)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  # checks: write is what lets log-stream create and update the check run it streams the
  # installer step into. Without it the action answers 403 "Resource not accessible by
  # integration" and, correctly, carries on without streaming rather than failing.
  checks: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      image: ${{ steps.tag.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: free disk space
        run: |
          set -eux
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af || true
          df -h / | tail -1

      # Show the two lines we care about before and after, so the patch is
      # visible in the log rather than trusted.
      - name: patch the Dockerfile
        run: |
          set -eux
          echo "=== before ==="
          grep -n "exclude" Dockerfile || true
          python3 dockerfiles/patch_upstream.py Dockerfile
          echo "=== after ==="
          sed -n '1,12p' Dockerfile

      - name: build
        id: tag
        run: |
          set -eux
          img="dockur-macos-fixed:${{ github.run_number }}"
          docker build --progress=plain -t "$img" .
          docker image inspect "$img" --format 'id={{.Id}} size={{.Size}}'
          echo "image=$img" >> "$GITHUB_OUTPUT"

      # The whole point of the build: the unattended path must be inside. This is
      # the check that failed against the published v3.12 image, where /run had no
      # image.sh at all and every marker was absent.
      - name: is the unattended code in the image
        run: |
          set -eux
          docker run --rm --entrypoint sh "${{ steps.tag.outputs.image }}" -c '
            echo "--- /run ---"
            ls -1 /run/*.sh 2>/dev/null | xargs -n1 basename
            echo "--- prepareAutomatedRecovery ---"
            grep -l prepareAutomatedRecovery /run/*.sh 2>/dev/null || echo ABSENT
            echo "--- patchRecoveryBootstrap ---"
            grep -l patchRecoveryBootstrap /run/*.sh 2>/dev/null || echo ABSENT
            echo "--- Preparing automated ---"
            grep -l "Preparing automated" /run/*.sh 2>/dev/null || echo ABSENT
            echo "--- MANUAL default (this build should default to Y, unattended is opt-in) ---"
            grep -n "MANUAL" /run/install.sh 2>/dev/null | head -5 || echo "no MANUAL in install.sh"
            echo "--- install/ tree ---"
            find /run/install -type f 2>/dev/null | sort || echo "no /run/install"
            echo "--- version ---"
            cat /etc/version 2>/dev/null || echo none
          '

      - name: export for the bake job
        if: github.event.inputs.run_bake == 'true'
        run: |
          set -eux
          docker save "${{ steps.tag.outputs.image }}" -o /tmp/image.tar
          ls -la /tmp/image.tar

      - uses: actions/upload-artifact@v4
        if: github.event.inputs.run_bake == 'true'
        with:
          name: macos-image-fixed
          path: /tmp/image.tar
          retention-days: 2
          compression-level: 0

  bake:
    needs: build
    if: github.event.inputs.run_bake == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-utils

      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune -af || true
          df -h / | tail -1

      - uses: actions/download-artifact@v4
        with:
          name: macos-image-fixed
          path: /tmp/img

      - name: load
        run: docker load -i /tmp/img/image.tar

      - name: start
        run: |
          set -eux
          mkdir -p "$GITHUB_WORKSPACE/storage"
          # MANUAL=N is what selects the automated branch; the image defaults to
          # Y. NET_ADMIN + /dev/net/tun are needed for a real NAT bridge, without
          # which macOS cannot reach Apple to fetch the rest of the installer.
          #
          # MANUAL=Y is for the versions the automated branch cannot install: that
          # branch binary-patches rc.cdrom.sh in the recovery image, and the patch
          # matches macOS 14 only ("Expected exactly one rc.cdrom.sh bootstrap,
          # found 0"). Upstream ships the same patch.py with the same
          # SCRIPT_ORIGINAL, so no version input fixes it.
          #
          # In BOTH cases this container is only asked to PREPARE: it downloads the
          # recovery image and writes setup.dmg, data.img, boot.img, macos.rom and
          # macos.vars into /storage/<version>/, which is the bind mount. The next
          # step then starts qemu itself, which is what deploy-macos-desktop does and
          # what makes the QMP socket reachable.
          #
          # Not using ARGS to add a socket here: the measurement says it does not
          # arrive. The container's own argv shows
          #   -monitor unix:/run/shm/monitor.sock
          # and no -qmp at all, and /run/shm is container-private tmpfs - so the
          # socket exists but nobody outside can see it.
          docker run -d --name macbake \
            --device=/dev/kvm --device=/dev/net/tun --cap-add NET_ADMIN \
            -e VERSION=${{ github.event.inputs.macos_version }} -e DISK_SIZE=64G -e RAM_SIZE=8G -e CPU_CORES=4 \
            -e MANUAL=${{ github.event.inputs.manual_install && 'Y' || 'N' }} \
            -v "$GITHUB_WORKSPACE/storage:/storage" \
            "${{ needs.build.outputs.image }}"
          sleep 30
          docker logs --tail 50 macbake || true

      # Wait for the INSTALL TO FINISH, not merely to start.
      #
      # The measured timeline from the previous run, with a working unattended
      # path: 765 MiB while the recovery image downloads (~8 min), then a jump to
      # 1418 MiB and 2386 MiB once startosinstall begins writing. A full install
      # keeps growing for tens of minutes after that.
      #
      # There is no single marker to poll here. bootstrap.done exists only inside
      # the guest at /Volumes/installstate, and after startosinstall's prepare
      # phase launch.sh ends in "while :; do sleep 60; done" waiting for a reboot,
      # so the container never exits by itself. What the host CAN see is the disk:
      # du over the mount climbs while the installer writes and stops when it
      # finishes. So: require it to have grown past the download baseline, then
      # require it to be unchanged for STABLE polls in a row.
      # Wait on the marker the guest itself writes, not on du.
      #
      # du over the storage tree is noise, measured: one run went
      # 765 -> 8065 -> 27306 -> 18555 -> 28159 -> 15637 -> 14891 MiB without the
      # container ever reinstalling anything. An APFS install writes and deletes
      # temporary files, so "unchanged for N polls" only measures the gap between
      # two of them. The runs that looked settled at 27306 MiB were just lucky.
      #
      # install/recovery/launch.sh gates everything on bootstrap.done:
      #
      #   [ -e "$BOOTSTRAP_DONE" ]   && { kill -USR1 "$STARTOSINSTALL_PID"; break; }
      #   [ -e "$BOOTSTRAP_FAILED" ] && fail "bootstrap installation failed"
      #
      # so that marker is both "the guest finished" and "a reboot is coming".
      #
      # 60 minutes, and a screenshot before returning either way: a picture of a
      # stalled screen says more than another size reading ever did.
      - name: wait for the install to finish
        id: wait
        if: github.event.inputs.manual_install != 'true'
        timeout-minutes: 100
        run: |
          set -eux
          chmod +x scripts/wait_for_bootstrap.sh
          # stage 1: 40 min for bootstrap.done; stage 2: 50 min for the guest to
          # finish installing by itself. Neither number is a guess about the
          # total: bootstrap.done arrives around 15 minutes in, and the screen at
          # that moment says "About 29 minutes remaining".
          bash scripts/wait_for_bootstrap.sh macbake \
            "$GITHUB_WORKSPACE/storage" 2400 3000 \
            "$GITHUB_WORKSPACE/waitstate"
        continue-on-error: true

      - name: keep the wait-stage screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wait-screenshot
          path: |
            waitstate.png
            waitstate.ppm
          if-no-files-found: warn
          retention-days: 7

      # The manual branch: drive Apple's installer to Setup Assistant by clicking.
      #
      # Everything before this step is the SAME as the automated path - same image,
      # same dockur container, same disk, same recovery image, same OpenCore. The only
      # differences are MANUAL=Y (so the rc.cdrom patch is not attempted) and the QMP
      # socket that the ARGS above adds, which is what makes clicking possible.
      #
      # The -setup disk this produces is the input to the next stage, which drives
      # Setup Assistant to the desktop; that path is already proven on 14.
      - name: drive the installer to Setup Assistant
        if: github.event.inputs.manual_install == 'true'
        # log-stream turns this step's output into a check-run that updates every few
        # seconds, so the run can be watched live instead of polling for a completion
        # that is twenty minutes away. checks: write is what lets it create and update
        # that check run; without it the action answers 403 and carries on unstreamed.
        uses: easydev-org/easyagent-github-ext/actions/log-stream@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: installer-drive
          interval: "10"
          command: |
            set -eux
            V="${{ github.event.inputs.macos_version }}"
            mkdir -p frames
            chmod 777 frames

            # Wait for the ASSETS, not for a socket. The container writes setup.dmg,
            # data.img, boot.img, macos.rom and macos.vars into /storage/$V; once all
            # five are there it has done everything this step needs from it. The
            # measured argv shows those exact paths are what qemu opens, so their
            # presence is the real "prepared" signal.
            for i in $(seq 1 120); do
              if [ -s "storage/$V/setup.dmg" ] && [ -s "storage/$V/data.img" ] \
                 && [ -s "storage/$V/boot.img" ] && [ -s "storage/$V/macos.rom" ] \
                 && [ -s "storage/$V/macos.vars" ]; then
                echo "assets ready after $((i*5))s"
                break
              fi
              echo "[$((i*5))s] waiting for the recovery image and disk"
              sleep 5
            done
            ls -la "storage/$V/" | head -20

            # Stop it. Its qemu has no reachable control socket (/run/shm is
            # container-private tmpfs) and it is about to boot the installer with
            # nobody able to click. Handing qemu to the next step is the whole point.
            docker rm -f macbake >/dev/null 2>&1 || true
            sleep 5

            # The same handover deploy-macos-desktop performs: dockur's assets in /vm,
            # qemu started by our own script, socket on the bind mount.
            mkdir -p vm
            cp -f "storage/$V/boot.img"   vm/boot.img
            cp -f "storage/$V/macos.rom"  vm/macos.rom
            cp -f "storage/$V/macos.vars" vm/macos.vars
            cp -f "storage/$V/setup.dmg"  vm/setup.dmg
            cp --sparse=always "storage/$V/data.img" vm/data.img
            ls -la vm/

            chmod +x scripts/drive-in-container.sh
            docker run -d --name macinst \
              --device=/dev/kvm \
              --entrypoint sh \
              -v "$GITHUB_WORKSPACE/vm:/vm" \
              -v "$GITHUB_WORKSPACE/frames:/frames" \
              -v "$GITHUB_WORKSPACE/scripts:/scripts:ro" \
              "${{ needs.build.outputs.image }}" /scripts/drive-in-container.sh
            sleep 30
            docker logs --tail 40 macinst || true
            ls -la frames/ || true

            sudo apt-get install -y -qq tesseract-ocr
            # The full drive, now that Show All Devices has a measured position. That one
            # menu item is what puts the empty 64 GiB disk into the sidebar at all.
            sudo python3 scripts/erase-by-coords.py \
              "$GITHUB_WORKSPACE/frames/monitor.sock" \
              "$GITHUB_WORKSPACE/frames/stage1" || true
            sudo chown -R "$(id -u):$(id -g)" frames || true
            docker rm -f macinst >/dev/null 2>&1 || true
            echo "=== installer log ==="
            tail -80 frames/stage1-installer.log 2>/dev/null || true

      - name: did the manual install reach Setup Assistant
        if: github.event.inputs.manual_install == 'true'
        run: |
          set -eux
          if grep -q "SETUP ASSISTANT REACHED" frames/stage1-installer.log 2>/dev/null; then
            echo "reached Setup Assistant"
          else
            echo "::error::the installer did not reach Setup Assistant; see the frames artifact"
            exit 1
          fi

      - name: upload the installer frames
        if: always() && github.event.inputs.manual_install == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: installer-frames
          path: |
            frames/**
          if-no-files-found: warn
          retention-days: 14

      - name: what is actually on the disk
        run: |
          set -eux
          sudo apt-get install -y -qq gdisk || true
          chmod +x scripts/inspect-installed-disk.sh
          sudo bash scripts/inspect-installed-disk.sh             "$GITHUB_WORKSPACE/storage/${{ github.event.inputs.macos_version }}/data.img"

      # The disk holds a complete macOS - 692 boot.efi hits, 128
      # System/Library/CoreServices, 455 Preboot, on an AF0A APFS partition - but
      # OpenCore offers no macOS volume. It cannot read APFS: the driver probe
      # reported "APFS on ESP: NONE", and EnableJumpstart does not supply a
      # driver, it hooks one the firmware is expected to have. OVMF has none.
      #
      # macOS writes its own copy to EFI/APPLE/EXTENSIONS/apfs.efi in the 200 MiB
      # EFI partition while installing, so the driver needed to boot this disk is
      # already inside it. Copy it into OpenCore's driver directory and list it in
      # the config, and the AF0A container becomes readable.
      - name: give OpenCore an APFS driver from the disk itself
        if: github.event.inputs.manual_install != 'true'
        id: apfs
        # Not fatal any more. The driver is a nice-to-have: bootstrap.done means
        # the install completed, and a completed install registers its own
        # Preboot entry, which OpenCore can follow without an external APFS
        # driver. If the driver cannot be found, boot anyway and find out -
        # the previous runs never got this far, so there is no evidence yet that
        # the driver is actually required.
        continue-on-error: true
        run: |
          set -eux
          sudo apt-get install -y -qq mtools p7zip-full
          chmod +x scripts/fix-opencore-apfs.sh
          sudo -E LAUNCHER_IMAGE="${{ needs.build.outputs.image }}" \
            bash scripts/fix-opencore-apfs.sh \
            "$GITHUB_WORKSPACE/storage/${{ github.event.inputs.macos_version }}/data.img" \
            "$GITHUB_WORKSPACE/storage/${{ github.event.inputs.macos_version }}/boot.img"

          WORK=/tmp/apfscfg
          rm -rf "$WORK"; mkdir -p "$WORK"
          sudo mcopy -i "$GITHUB_WORKSPACE/storage/${{ github.event.inputs.macos_version }}/boot.img@@1M" \
            ::/EFI/OC/config.plist "$WORK/config.plist"
          sudo chown "$(id -u):$(id -g)" "$WORK/config.plist"
          python3 scripts/enable-apfs-driver.py "$WORK/config.plist"
          sudo mcopy -o -i "$GITHUB_WORKSPACE/storage/${{ github.event.inputs.macos_version }}/boot.img@@1M" \
            "$WORK/config.plist" ::/EFI/OC/config.plist

          echo "=== config as stored in boot.img ==="
          sudo mcopy -i "$GITHUB_WORKSPACE/storage/${{ github.event.inputs.macos_version }}/boot.img@@1M" \
            ::/EFI/OC/config.plist "$WORK/verify.plist"
          python3 scripts/check-config-drivers.py "$WORK/verify.plist"

      - name: resume the install (the reboot startosinstall waits for)
        if: false    # disabled: resume provably does nothing (disk sat at 27306 MiB for 55 min)
        id: resume
        env:
          POLL: "30"
          MAX_POLLS: "120"        # 60 minutes, then stop and look at the state
        run: |
          set -eux
          before=$(du -sm "$GITHUB_WORKSPACE/storage" | cut -f1)
          echo "disk before restart: ${before}MiB"

          # Look at the bootstrap state BEFORE restarting. If bootstrap.done never
          # appeared, the guest never finished its part and a restart will just
          # reinstall from scratch - which is precisely what the previous run did
          # (dockur logged "Downloading macOS recovery" and "Creating a 64 GB
          # growable disk" again, and the disk dropped to 15 GiB).
          echo "=== bootstrap state before restart ==="
          bash scripts/installstate-probe.sh macbake || true

          # Copy the guest-written logs out while the container still exists; they
          # are gone once it is removed, and they say why bootstrap stopped.
          mkdir -p guestlogs
          docker cp macbake:/run/shm/installstate guestlogs/. 2>/dev/null ||             echo "could not copy installstate (nothing there)"
          ls -la guestlogs/ 2>/dev/null | head -20 || true

          docker rm -f macbake || true
          docker run -d --name macstage2 \
            --device=/dev/kvm --device=/dev/net/tun --cap-add NET_ADMIN \
            -e VERSION=${{ github.event.inputs.macos_version }} -e DISK_SIZE=64G -e RAM_SIZE=8G -e CPU_CORES=4 \
            -e MANUAL=Y \
            -v "$GITHUB_WORKSPACE/storage:/storage" \
            "${{ needs.build.outputs.image }}"
          sleep 30
          docker logs --tail 30 macstage2 || true

          last=-1; stable=0; grew=0
          for i in $(seq 1 "$MAX_POLLS"); do
            sleep "$POLL"
            used=$(du -sm "$GITHUB_WORKSPACE/storage" | cut -f1)
            echo "[$((i*POLL))s] stage2 storage_used=${used}MiB (before=${before})"
            if [ "$used" -gt "$before" ]; then grew=1; fi
            if [ "$used" = "$last" ]; then stable=$((stable+1)); else stable=0; fi
            last=$used
            if [ "$grew" = "1" ] && [ "$stable" -ge 10 ] && [ "$used" -gt "$before" ]; then
              echo "STAGE 2 SETTLED at ${used}MiB (grew from ${before}MiB)"
              break
            fi
            if ! docker ps --format '{{.Names}}' | grep -qx macstage2; then
              echo "stage2 container exited"
              docker logs --tail 120 macstage2 || true
              break
            fi
          done

          after=$(du -sm "$GITHUB_WORKSPACE/storage" | cut -f1)
          echo "disk after the stage2 window: ${after}MiB (delta $((after - before))MiB)"
          if [ "$after" -gt "$before" ]; then
            echo "STAGE 2 RAN: the disk grew by $((after - before))MiB"
          elif [ "$after" -lt $((before - 2000)) ]; then
            # A large drop means dockur's hasData() judged the disk empty and
            # install() started over with `rm -f "$dest"` - the exact failure
            # this step exists to avoid, so fail loudly rather than carry on.
            echo "::error::the disk SHRANK from ${before}MiB to ${after}MiB - dockur reinstalled instead of continuing"
            docker logs --tail 80 macstage2 || true
            exit 1
          else
            echo "::warning::the disk did not grow - stage 2 may not have run"
          fi
          docker stop -t 300 macstage2 || true
          docker rm -f macstage2 || true
      - name: boot the golden disk directly and look at the desktop
        if: github.event.inputs.manual_install != 'true'
        id: desktop
        run: |
          set -eux
          echo "=== stopping the installer container ==="
          docker stop -t 300 macbake || true
          docker rm -f macbake || true

          # KVM access for the runner user, and the tools the script needs.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get install -y -qq qemu-system-x86 mtools

          # boot.img now carries apfs.efi, taken from the disk's own EFI
          # partition and listed in its config. If OpenCore can read the AF0A
          # container it will offer Macintosh HD and boot straight through - the
          # config already sets ShowPicker=false, HideAuxiliary=true, Timeout=2.
          #
          # A pre-installed system needs a minute or two, not forty: the long
          # window earlier existed to watch an install that never happened.
          chmod +x scripts/boot-golden.sh
          sudo -E bash scripts/boot-golden.sh \
            "$GITHUB_WORKSPACE/storage/${{ github.event.inputs.macos_version }}" \
            /tmp/golden-monitor.sock \
            600 &
          BOOT_WAIT=$!

          # Forty minutes of looks, not seven.
          #
          # Seven was far too short and the reason is now known: the install has
          # two phases. Phase 1 (startosinstall prepare) writes ~28 GiB and then
          # launch.sh prints "waiting for reboot" and sleeps; startosinstall was
          # given --rebootdelay 300, so a reboot follows and macOS's own installer
          # does the real work, writing for tens of minutes more. A screenshot
          # taken at 2.5 minutes can only ever show the phase-1 state.
          #
          # So: sample every 5 minutes, log the disk size each time, and keep both
          # the frame and whether it changed. The disk growing during this window
          # is itself the proof that phase 2 is running.
          #
          # sudo, because qemu runs under sudo and the monitor socket is owned by
          # root: connecting as the runner user failed with
          # 'PermissionError: [Errno 13] Permission denied'.
          shot() {
            sudo python3 scripts/shotsock.py /tmp/golden-monitor.sock "./$1.ppm" || return 1
            sudo chown "$(id -u):$(id -g)" "./$1.ppm" 2>/dev/null || true
            python3 scripts/ppm2png.py "./$1.ppm" "./$1.png" || true
            ls -la "./$1.png" 2>/dev/null || true
          }

          prev=""
          for round in $(seq 1 6); do
            sleep 120
            used=$(du -sm "$GITHUB_WORKSPACE/storage" | cut -f1)
            echo "=== round $round: disk=${used}MiB (previous=${prev:-none}) ==="
            shot "desktop$round" || echo "round $round screenshot failed"
            if [ -n "$prev" ] && [ "$used" = "$prev" ]; then
              echo "disk unchanged since last round"
            fi
            prev="$used"
            # qemu gone means the guest powered off - stop sampling.
            if ! pgrep -f "qemu-system-x86_64.*data.img" >/dev/null 2>&1; then
              echo "qemu exited at round $round"
              break
            fi
          done

          echo "=== disk growth across the window confirms phase 2 ==="
          du -sm "$GITHUB_WORKSPACE/storage"
          # Stop qemu before extract touches the disk.
          #
          # kill on the recorded pid was not enough: qemu runs under sudo, so its
          # parent is the sudo wrapper and the disk kept a write lock, which made
          # qemu-img fail with 'Failed to get shared "write" lock'. Match the
          # process by name and wait for it to actually disappear.
          sudo pkill -f "qemu-system-x86_64.*data.img" 2>/dev/null || true
          for _ in $(seq 1 30); do
            pgrep -f "qemu-system-x86_64.*data.img" >/dev/null 2>&1 || break
            sleep 2
          done
          pgrep -f "qemu-system-x86_64.*data.img" >/dev/null 2>&1 && sudo pkill -9 -f "qemu-system-x86_64.*data.img" || true
          sleep 3
          wait "$BOOT_WAIT" 2>/dev/null || true
          echo "=== qemu log ==="
          tail -40 /tmp/qemu-boot.log 2>/dev/null || true

          # The picture is the verdict. ppm2png prints the distinct colour count
          # and fails on a single-colour framebuffer, so a black screen is caught
          # rather than silently accepted.
          if ls desktop*.png >/dev/null 2>&1; then
            echo "screenshots captured"; ls -la desktop*.png 2>/dev/null || true
          else
            echo "::warning::no screenshot could be captured"
          fi

      # Now stop it and take the disk. An ACPI shutdown first, so the filesystem
      # is consistent. data.img is a raw 64 GiB image under /storage/<version>/,
      # not a qcow2 at /storage/data.img - the Windows bake made exactly that
      # mistake and spent three runs learning it.
      - name: extract the golden disk
        if: success()
        run: |
          set -eux
          echo "stopping the guest"
          sudo pkill -f "qemu-system-x86_64" 2>/dev/null || true
          for _ in $(seq 1 30); do
            pgrep -f "qemu-system-x86_64.*data.img" >/dev/null 2>&1 || break
            sleep 2
          done
          # Belt and braces: prove no process holds the image before converting.
          if pgrep -f "qemu-system-x86_64.*data.img" >/dev/null 2>&1; then
            echo "::error::qemu still running, refusing to touch the disk"
            exit 1
          fi

          # Find the disk by asking the filesystem, not by guessing a name.
          SRC=""
          while IFS= read -r f; do
            [ "$(stat -c %s "$f" 2>/dev/null || echo 0)" -gt $((8*1024*1024*1024)) ] || continue
            case "$f" in *.dmg|*.iso|*.img.old) continue ;; esac
            if qemu-img info "$f" >/dev/null 2>&1; then SRC="$f"; break; fi
          done < <(find "$GITHUB_WORKSPACE/storage" -type f -printf "%s %p\n" 2>/dev/null | sort -rn | cut -d" " -f2-)

          if [ -z "$SRC" ]; then
            echo "::error::no disk image found"
            find "$GITHUB_WORKSPACE/storage" -maxdepth 3 -printf "%10s %p\n" | sort -rn | head -20
            exit 1
          fi

          echo "extracting $SRC"
          ls -la "$SRC"
          du -h "$SRC"
          # -c compresses stored clusters. The image becomes an overlay backing
          # file, so the decompression cost is paid once per sandbox.
          qemu-img convert -O qcow2 -c "$SRC" "$GITHUB_WORKSPACE/macos-golden.qcow2"
          ls -la "$GITHUB_WORKSPACE/macos-golden.qcow2"
          qemu-img info "$GITHUB_WORKSPACE/macos-golden.qcow2"
          du -h "$GITHUB_WORKSPACE/macos-golden.qcow2"

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: macos-golden
          path: ${{ github.workspace }}/macos-golden.qcow2
          retention-days: 7
          compression-level: 0

      # The desktop screenshots taken after the reboot. Uploaded always, because
      # a black or Recovery screen IS the result worth looking at when something
      # went wrong.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-desktop
          path: |
            s2-*.png
            s2-*.ppm
            final.png
            final.ppm
            desktop*.png
            desktop*.ppm
            waitstate.png
            waitstate.ppm
            guestlogs/**
            guestlogs/*
          if-no-files-found: warn
          retention-days: 14

      - name: stop
        if: always()
        run: |
          docker rm -f macbake 2>/dev/null || true
          docker rm -f macboot 2>/dev/null || true
