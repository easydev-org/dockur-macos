name: build-with-fix

# Build dockur/macos against qemux/qemu:7.50 - the base upstream pins - by
# working around the one line that cannot work, then verify the unattended code
# is actually inside the result.
#
# Established in CI by diagnose-build:
#   exclude  FAIL  failed to calculate checksum ... "/etc/alternatives/awk.1.gz"
#   repair   FAIL  deleting the dangling link first does not help
#   plain    OK    COPY the whole tree, then rm the binary in the same layer
#   rsync    OK    tar inside the source container, untar into scratch
#
# plain is the smaller change and leaves no extra bytes (COPY and RUN land in
# the same layer), so that is what patch_upstream.py applies.

on:
  workflow_dispatch:
    inputs:
      run_bake:
        description: "Also attempt a macOS install with the built image"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      image: ${{ steps.tag.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: free disk space
        run: |
          set -eux
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af || true
          df -h / | tail -1

      # Show the two lines we care about before and after, so the patch is
      # visible in the log rather than trusted.
      - name: patch the Dockerfile
        run: |
          set -eux
          echo "=== before ==="
          grep -n "exclude" Dockerfile || true
          python3 dockerfiles/patch_upstream.py Dockerfile
          echo "=== after ==="
          sed -n '1,12p' Dockerfile

      - name: build
        id: tag
        run: |
          set -eux
          img="dockur-macos-fixed:${{ github.run_number }}"
          docker build --progress=plain -t "$img" .
          docker image inspect "$img" --format 'id={{.Id}} size={{.Size}}'
          echo "image=$img" >> "$GITHUB_OUTPUT"

      # The whole point of the build: the unattended path must be inside. This is
      # the check that failed against the published v3.12 image, where /run had no
      # image.sh at all and every marker was absent.
      - name: is the unattended code in the image
        run: |
          set -eux
          docker run --rm --entrypoint sh "${{ steps.tag.outputs.image }}" -c '
            echo "--- /run ---"
            ls -1 /run/*.sh 2>/dev/null | xargs -n1 basename
            echo "--- prepareAutomatedRecovery ---"
            grep -l prepareAutomatedRecovery /run/*.sh 2>/dev/null || echo ABSENT
            echo "--- patchRecoveryBootstrap ---"
            grep -l patchRecoveryBootstrap /run/*.sh 2>/dev/null || echo ABSENT
            echo "--- Preparing automated ---"
            grep -l "Preparing automated" /run/*.sh 2>/dev/null || echo ABSENT
            echo "--- MANUAL default (this build should default to Y, unattended is opt-in) ---"
            grep -n "MANUAL" /run/install.sh 2>/dev/null | head -5 || echo "no MANUAL in install.sh"
            echo "--- install/ tree ---"
            find /run/install -type f 2>/dev/null | sort || echo "no /run/install"
            echo "--- version ---"
            cat /etc/version 2>/dev/null || echo none
          '

      - name: export for the bake job
        if: github.event.inputs.run_bake == 'true'
        run: |
          set -eux
          docker save "${{ steps.tag.outputs.image }}" -o /tmp/image.tar
          ls -la /tmp/image.tar

      - uses: actions/upload-artifact@v4
        if: github.event.inputs.run_bake == 'true'
        with:
          name: macos-image-fixed
          path: /tmp/image.tar
          retention-days: 2
          compression-level: 0

  bake:
    needs: build
    if: github.event.inputs.run_bake == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-utils

      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune -af || true
          df -h / | tail -1

      - uses: actions/download-artifact@v4
        with:
          name: macos-image-fixed
          path: /tmp/img

      - name: load
        run: docker load -i /tmp/img/image.tar

      - name: start
        run: |
          set -eux
          mkdir -p "$GITHUB_WORKSPACE/storage"
          # MANUAL=N is what selects the automated branch; the image defaults to
          # Y. NET_ADMIN + /dev/net/tun are needed for a real NAT bridge, without
          # which macOS cannot reach Apple to fetch the rest of the installer.
          docker run -d --name macbake \
            --device=/dev/kvm --device=/dev/net/tun --cap-add NET_ADMIN \
            -e VERSION=14 -e DISK_SIZE=64G -e RAM_SIZE=8G -e CPU_CORES=4 \
            -e MANUAL=N \
            -v "$GITHUB_WORKSPACE/storage:/storage" \
            "${{ needs.build.outputs.image }}"
          sleep 30
          docker logs --tail 50 macbake || true

      # Wait for the INSTALL TO FINISH, not merely to start.
      #
      # The measured timeline from the previous run, with a working unattended
      # path: 765 MiB while the recovery image downloads (~8 min), then a jump to
      # 1418 MiB and 2386 MiB once startosinstall begins writing. A full install
      # keeps growing for tens of minutes after that.
      #
      # There is no single marker to poll here. bootstrap.done exists only inside
      # the guest at /Volumes/installstate, and after startosinstall's prepare
      # phase launch.sh ends in "while :; do sleep 60; done" waiting for a reboot,
      # so the container never exits by itself. What the host CAN see is the disk:
      # du over the mount climbs while the installer writes and stops when it
      # finishes. So: require it to have grown past the download baseline, then
      # require it to be unchanged for STABLE polls in a row.
      - name: wait for the install to finish
        id: wait
        env:
          POLL: "30"
          # The install is TWO phases, and the disk shows it:
          #
          #   ~30s   765 MiB   downloading the recovery image
          #   ~330s  5683 MiB  phase 1 (startosinstall prepare) writing
          #   ~930s 27306 MiB  phase 1 looks finished
          #  ~1230s 28499 MiB  then launch.sh prints "waiting for reboot" and
          #                     sits in a permanent sleep loop
          #
          # startosinstall was launched with --rebootdelay 300, so a reboot comes
          # about five minutes after the prepare phase and macOS's own installer
          # keeps writing afterwards. Treating the first quiet spell as "finished"
          # is precisely what produced a disk holding only Apple's recovery.
          #
          # So require two settled windows separated by renewed growth: one quiet
          # stretch is a phase boundary, two means the disk really stopped.
          STABLE_POLLS: "10"      # 5 minutes of no growth ends a phase
          PHASES: "2"
          MAX_POLLS: "240"        # hard ceiling ~120 minutes
        run: |
          set -eux
          last=-1
          stable=0
          started=0
          phase=0
          peak=0
          for i in $(seq 1 "$MAX_POLLS"); do
            sleep "$POLL"
            used=$(du -sm "$GITHUB_WORKSPACE/storage" | cut -f1)
            echo "[$((i*POLL))s] storage_used=${used}MiB stable=${stable} phase=${phase}/${PHASES}"

            if [ "$used" -lt 2000 ]; then
              # still downloading the recovery image, or not started yet
              :
            else
              started=1
            fi

            if [ "$used" -gt "$peak" ]; then peak=$used; fi

            if [ "$used" = "$last" ]; then
              stable=$((stable + 1))
            else
              stable=0
            fi
            last=$used

            if [ "$started" = "1" ] && [ "$stable" -ge "$STABLE_POLLS" ]; then
              phase=$((phase + 1))
              echo "PHASE $phase settled at ${used}MiB after $((i*POLL))s"
              if [ "$phase" -ge "$PHASES" ]; then
                echo "INSTALL SETTLED after $phase phases at ${used}MiB (peak ${peak}MiB)"
                break
              fi
              # Reset so the next burst of growth needs its own quiet window.
              stable=0
              last=-1
            fi

            if ! docker ps --format '{{.Names}}' | grep -qx macbake; then
              echo "container exited"
              docker logs --tail 120 macbake || true
              break
            fi
          done

          if [ "$started" = "0" ]; then
            echo "::error::the installer never wrote more than 2000MiB - the unattended path did not run"
            docker logs --tail 120 macbake || true
            exit 1
          fi
          if [ "$phase" -lt "$PHASES" ]; then
            echo "::warning::only $phase of $PHASES install phases settled - the disk may still be stage-1 recovery only"
          fi

          echo "=== unattended markers in the container log ==="
          docker logs macbake 2>&1 | grep -Ei "preparing automated|patched startosinstall|startosinstall|bootstrap|erasing" | head -20 || echo none
          echo "=== storage tree ==="
          find "$GITHUB_WORKSPACE/storage" -maxdepth 3 -printf "%10s %p\n" 2>/dev/null | sort -rn | head -10 || true
      - name: boot the golden disk directly and look at the desktop
        id: desktop
        run: |
          set -eux
          echo "=== stopping the installer container ==="
          docker stop -t 300 macbake || true
          docker rm -f macbake || true

          # KVM access for the runner user, and the tools the script needs.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get install -y -qq qemu-system-x86 mtools

          # Replace the config inside boot.img BEFORE booting: the one the bake
          # left behind has ShowPicker=true and HideAuxiliary=false, which is
          # why the screenshot showed a menu with Reset NVRAM / Toggle SIP and no
          # macOS volume. The template flips that to boot straight through, and
          # the identity keys are carried over from the current config so macOS
          # still sees the hardware it was installed against.
          chmod +x scripts/fix-opencore.sh
          sudo -E bash scripts/fix-opencore.sh \
            "$GITHUB_WORKSPACE/storage/14" \
            "$GITHUB_WORKSPACE/assets/config.plist"

          chmod +x scripts/boot-golden.sh
          sudo -E bash scripts/boot-golden.sh \
            "$GITHUB_WORKSPACE/storage/14" \
            /tmp/golden-monitor.sock \
            2400 &
          BOOT_WAIT=$!

          # Forty minutes of looks, not seven.
          #
          # Seven was far too short and the reason is now known: the install has
          # two phases. Phase 1 (startosinstall prepare) writes ~28 GiB and then
          # launch.sh prints "waiting for reboot" and sleeps; startosinstall was
          # given --rebootdelay 300, so a reboot follows and macOS's own installer
          # does the real work, writing for tens of minutes more. A screenshot
          # taken at 2.5 minutes can only ever show the phase-1 state.
          #
          # So: sample every 5 minutes, log the disk size each time, and keep both
          # the frame and whether it changed. The disk growing during this window
          # is itself the proof that phase 2 is running.
          #
          # sudo, because qemu runs under sudo and the monitor socket is owned by
          # root: connecting as the runner user failed with
          # 'PermissionError: [Errno 13] Permission denied'.
          shot() {
            sudo python3 scripts/shotsock.py /tmp/golden-monitor.sock "./$1.ppm" || return 1
            sudo chown "$(id -u):$(id -g)" "./$1.ppm" 2>/dev/null || true
            python3 scripts/ppm2png.py "./$1.ppm" "./$1.png" || true
            ls -la "./$1.png" 2>/dev/null || true
          }

          prev=""
          for round in $(seq 1 8); do
            sleep 300
            used=$(du -sm "$GITHUB_WORKSPACE/storage" | cut -f1)
            echo "=== round $round: disk=${used}MiB (previous=${prev:-none}) ==="
            shot "desktop$round" || echo "round $round screenshot failed"
            if [ -n "$prev" ] && [ "$used" = "$prev" ]; then
              echo "disk unchanged since last round"
            fi
            prev="$used"
            # qemu gone means the guest powered off - stop sampling.
            if ! pgrep -f "qemu-system-x86_64.*data.img" >/dev/null 2>&1; then
              echo "qemu exited at round $round"
              break
            fi
          done

          echo "=== disk growth across the window confirms phase 2 ==="
          du -sm "$GITHUB_WORKSPACE/storage"
          # Stop qemu before extract touches the disk.
          #
          # kill on the recorded pid was not enough: qemu runs under sudo, so its
          # parent is the sudo wrapper and the disk kept a write lock, which made
          # qemu-img fail with 'Failed to get shared "write" lock'. Match the
          # process by name and wait for it to actually disappear.
          sudo pkill -f "qemu-system-x86_64.*data.img" 2>/dev/null || true
          for _ in $(seq 1 30); do
            pgrep -f "qemu-system-x86_64.*data.img" >/dev/null 2>&1 || break
            sleep 2
          done
          pgrep -f "qemu-system-x86_64.*data.img" >/dev/null 2>&1 && sudo pkill -9 -f "qemu-system-x86_64.*data.img" || true
          sleep 3
          wait "$BOOT_WAIT" 2>/dev/null || true
          echo "=== qemu log ==="
          tail -40 /tmp/qemu-boot.log 2>/dev/null || true

          # The picture is the verdict. ppm2png prints the distinct colour count
          # and fails on a single-colour framebuffer, so a black screen is caught
          # rather than silently accepted.
          if ls desktop*.png >/dev/null 2>&1; then
            echo "screenshots captured"; ls -la desktop*.png 2>/dev/null || true
          else
            echo "::warning::no screenshot could be captured"
          fi

      # Now stop it and take the disk. An ACPI shutdown first, so the filesystem
      # is consistent. data.img is a raw 64 GiB image under /storage/<version>/,
      # not a qcow2 at /storage/data.img - the Windows bake made exactly that
      # mistake and spent three runs learning it.
      - name: extract the golden disk
        if: success()
        run: |
          set -eux
          echo "stopping the guest"
          sudo pkill -f "qemu-system-x86_64" 2>/dev/null || true
          for _ in $(seq 1 30); do
            pgrep -f "qemu-system-x86_64.*data.img" >/dev/null 2>&1 || break
            sleep 2
          done
          # Belt and braces: prove no process holds the image before converting.
          if pgrep -f "qemu-system-x86_64.*data.img" >/dev/null 2>&1; then
            echo "::error::qemu still running, refusing to touch the disk"
            exit 1
          fi

          # Find the disk by asking the filesystem, not by guessing a name.
          SRC=""
          while IFS= read -r f; do
            [ "$(stat -c %s "$f" 2>/dev/null || echo 0)" -gt $((8*1024*1024*1024)) ] || continue
            case "$f" in *.dmg|*.iso|*.img.old) continue ;; esac
            if qemu-img info "$f" >/dev/null 2>&1; then SRC="$f"; break; fi
          done < <(find "$GITHUB_WORKSPACE/storage" -type f -printf "%s %p\n" 2>/dev/null | sort -rn | cut -d" " -f2-)

          if [ -z "$SRC" ]; then
            echo "::error::no disk image found"
            find "$GITHUB_WORKSPACE/storage" -maxdepth 3 -printf "%10s %p\n" | sort -rn | head -20
            exit 1
          fi

          echo "extracting $SRC"
          ls -la "$SRC"
          du -h "$SRC"
          # -c compresses stored clusters. The image becomes an overlay backing
          # file, so the decompression cost is paid once per sandbox.
          qemu-img convert -O qcow2 -c "$SRC" "$GITHUB_WORKSPACE/macos-golden.qcow2"
          ls -la "$GITHUB_WORKSPACE/macos-golden.qcow2"
          qemu-img info "$GITHUB_WORKSPACE/macos-golden.qcow2"
          du -h "$GITHUB_WORKSPACE/macos-golden.qcow2"

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: macos-golden
          path: ${{ github.workspace }}/macos-golden.qcow2
          retention-days: 7
          compression-level: 0

      # The desktop screenshots taken after the reboot. Uploaded always, because
      # a black or Recovery screen IS the result worth looking at when something
      # went wrong.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-desktop
          path: |
            desktop*.png
            desktop*.ppm
          if-no-files-found: warn
          retention-days: 14

      - name: stop
        if: always()
        run: |
          docker rm -f macbake 2>/dev/null || true
          docker rm -f macboot 2>/dev/null || true
