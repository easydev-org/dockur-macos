name: diagnose-recovery-script

# Print the real rc.cdrom.sh from a recovery image, so the patch needle can be fixed
# instead of worked around.
#
# The unattended path is entirely version-independent except for ONE STRING. patch.py
# replaces the opening comment block of /etc/rc.cdrom.sh inside the recovery DMG with a
# bootstrap that mounts the installstate share and execs launch.sh. The needle it looks
# for is macOS 14's text:
#
#   # launchd passes the "boot mode" to us, if one is set for this boot
#
# On 15 and 26 that block has changed, so find_all returns nothing and the patch refuses:
#
#   Recovery bootstrap patch failed: Expected exactly one rc.cdrom.sh bootstrap, found 0
#
# Everything downstream - the 9p share, launch.sh, select_target_disk, diskutil
# eraseDisk, startosinstall - is identical on all three. Correct the needle and 15/26 run
# through exactly the code path 14 runs through, with no GUI at all. That is the point of
# this job.
#
# The image is obtained by letting the container fetch it, because src/install.sh needs
# the container's environment ('strip: : No such file' when run directly on the runner).
# The container only has to download; it never needs to boot.

on:
  workflow_dispatch:
    inputs:
      macos_version:
        description: "macOS version whose recovery image to inspect"
        required: false
        default: "15"
      launcher_image:
        description: "Image carrying the dockur scripts"
        required: false
        default: "ghcr.io/easydev-org/dockur-macos-launcher:14"

permissions:
  contents: read
  packages: read

jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: tooling
        run: |
          set -eux
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-utils p7zip-full

      - name: pull the launcher image
        run: |
          set -eux
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | sudo docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          sudo docker pull "${{ github.event.inputs.launcher_image }}"
          sudo docker tag "${{ github.event.inputs.launcher_image }}" macos-diag

      - name: let the container download the recovery image
        run: |
          set -eux
          V="${{ github.event.inputs.macos_version }}"
          mkdir -p "$GITHUB_WORKSPACE/storage"

          sudo docker run -d --name dlg \
            --device=/dev/kvm \
            -e VERSION="$V" -e DISK_SIZE=64G -e RAM_SIZE=8G -e CPU_CORES=4 \
            -e MANUAL=Y \
            -v "$GITHUB_WORKSPACE/storage:/storage" \
            macos-diag

          # setup.dmg appears once the download finishes, which is several minutes; the
          # other assets arrive alongside it. Only the dmg is needed here.
          for i in $(seq 1 180); do
            if [ -s "storage/$V/setup.dmg" ]; then
              echo "setup.dmg present after $((i*5))s"
              break
            fi
            echo "[$((i*5))s] waiting"
            sleep 5
          done
          ls -la "storage/$V/" || true
          sudo docker rm -f dlg >/dev/null 2>&1 || true

      # Ask patch.py itself. It already decodes every chunk of this DMG in order to
      # search it, so its decode step is reused with the search aimed at a word the
      # script always contains.
      #
      # Two earlier attempts went the long way round and both failed for their own
      # reasons: qemu-img produced a 3.2 GB raw image whose grep hits were HFS+ catalog
      # nodes at 248 MB, and 7-Zip's extraction did not surface the file either. Reading
      # the container properly is what patch.py already does.
      - name: dump the chunks containing the script
        run: |
          set -ux
          V="${{ github.event.inputs.macos_version }}"
          SRC="storage/$V/setup.dmg"
          [ -s "$SRC" ] || { echo "::error::no setup.dmg"; exit 1; }
          ls -la "$SRC"

          python3 src/install/recovery/patch.py --dump "$SRC" > /tmp/dump.txt 2>&1 || true
          echo "dump size: $(wc -c < /tmp/dump.txt) bytes"
          head -400 /tmp/dump.txt

      - name: keep the extraction
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-context
          path: |
            /tmp/dump.txt
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
