name: diagnose-recovery-script

# Print the real rc.cdrom.sh from a macOS recovery image.
#
# The unattended installer works by binary-patching that file inside the recovery DMG:
# it replaces the script's opening comment block with a one-line bootstrap that mounts
# the installstate share and execs launch.sh. The needle it looks for is
#
#   # launchd passes the "boot mode" to us, if one is set for this boot
#   # in certain boot modes, we tell diskarbitrationd not to automatically
#   ...
#
# which is macOS 14's text. On 15 and 26 that block has changed, so the patch finds zero
# matches and refuses:
#
#   Recovery bootstrap patch failed: Expected exactly one rc.cdrom.sh bootstrap, found 0
#
# Everything else about the unattended path - the 9p share, launch.sh, select_target_disk,
# diskutil eraseDisk, startosinstall - is version-independent. Only this needle is not.
#
# So this job extracts the file and prints it. Then SCRIPT_ORIGINAL can be replaced with
# what 15 actually says, and 15/26 run through exactly the same code path as 14 instead
# of needing a GUI driver at all.

on:
  workflow_dispatch:
    inputs:
      macos_version:
        description: "macOS version whose recovery image to inspect"
        required: false
        default: "15"

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: tooling
        run: |
          set -eux
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-utils p7zip-full

      # Board identifiers select which Apple recovery catalogue answers, and each macOS
      # generation only asks for its own. Same table as src/install.sh.
      - name: download the recovery image
        run: |
          set -eux
          case "${{ github.event.inputs.macos_version }}" in
            15*) BOARD="Mac-937A206F2EE63C01" ;;
            26*|16*) BOARD="Mac-CFF7D910A743CAAF" ;;
            *) BOARD="Mac-827FAC58A8FDFA22" ;;
          esac
          echo "board=$BOARD"

          # Use src/install.sh's own downloader instead of re-implementing it.
          #
          # Apple's service wants a session cookie from a first throwaway request, then a
          # POST whose body is newline-separated cid/sn/bid/k/fg/os carrying freshly
          # generated nonces, and replies with space-delimited key/value text. Writing
          # that a second time here would just be another thing to get wrong - the
          # installer's copy already works, and stage 1 has been using it every run.
          mkdir -p /tmp/state
          V="${{ github.event.inputs.macos_version }}"
          BOARD_ID="$BOARD" VERSION="$V" STORAGE=/tmp/state \
          DISK_SIZE=64G RAM_SIZE=8G CPU_CORES=4 MANUAL=Y \
          timeout 1800 bash ./src/install.sh >/tmp/install.log 2>&1 || true
          tail -50 /tmp/install.log || true
          find /tmp/state -name '*.dmg' -exec ls -la {} + || true
          dmg=$(find /tmp/state -name '*.dmg' | head -1)
          [ -n "$dmg" ] || { echo "::error::installer produced no dmg"; exit 1; }
          cp "$dmg" /tmp/recovery.dmg
          ls -la /tmp/recovery.dmg

      # 7-Zip understands the UDIF container well enough to list and extract members,
      # which is what makes this possible on a Linux runner with no macOS tooling.
      - name: extract rc.cdrom.sh
        run: |
          set -eux
          7z l /tmp/recovery.dmg | head -40 || true
          7z x -y -o/tmp/rec /tmp/recovery.dmg || true
          echo "=== what came out ==="
          find /tmp/rec -maxdepth 3 | head -40 || true

          # The file lives at /etc/rc.cdrom.sh inside the HFS/APFS payload. Locate it by
          # content rather than by guessing a path: every macOS recovery carries the
          # word "diskarbitrationd" in that script.
          echo "=== searching for the script ==="
          find /tmp/rec -type f -size -200k 2>/dev/null | while read -r f; do
            if grep -qa "diskarbitrationd" "$f" 2>/dev/null; then
              echo "--- candidate: $f ---"
              head -60 "$f" | cat -v | head -60
            fi
          done

      - name: keep what was found
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-inspect
          path: |
            /tmp/rec/**
          if-no-files-found: warn
          retention-days: 7
