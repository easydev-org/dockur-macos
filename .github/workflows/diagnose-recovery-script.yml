name: diagnose-recovery-script

# Print the real rc.cdrom.sh from a recovery image, so the patch needle can be fixed
# instead of worked around.
#
# The unattended path is entirely version-independent except for ONE STRING. patch.py
# replaces the opening comment block of /etc/rc.cdrom.sh inside the recovery DMG with a
# bootstrap that mounts the installstate share and execs launch.sh. The needle it looks
# for is macOS 14's text:
#
#   # launchd passes the "boot mode" to us, if one is set for this boot
#
# On 15 and 26 that block has changed, so find_all returns nothing and the patch refuses:
#
#   Recovery bootstrap patch failed: Expected exactly one rc.cdrom.sh bootstrap, found 0
#
# Everything downstream - the 9p share, launch.sh, select_target_disk, diskutil
# eraseDisk, startosinstall - is identical on all three. Correct the needle and 15/26 run
# through exactly the code path 14 runs through, with no GUI at all. That is the point of
# this job.
#
# The image is obtained by letting the container fetch it, because src/install.sh needs
# the container's environment ('strip: : No such file' when run directly on the runner).
# The container only has to download; it never needs to boot.

on:
  workflow_dispatch:
    inputs:
      launcher_image:
        description: "Image carrying the dockur scripts"
        required: false
        default: "ghcr.io/easydev-org/dockur-macos-launcher:14"

permissions:
  contents: read
  packages: read

jobs:
  extract:
    # Two versions at once, because the question is comparative: patch.py finds its
    # needle in the 14 image and not in the 15 image, and only a side-by-side run says
    # whether the text changed or the container layout did.
    strategy:
      fail-fast: false
      matrix:
        version:
          - "14"
          - "15"
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: tooling
        run: |
          set -eux
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-utils p7zip-full

      - name: pull the launcher image
        run: |
          set -eux
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | sudo docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          sudo docker pull "${{ github.event.inputs.launcher_image }}"
          sudo docker tag "${{ github.event.inputs.launcher_image }}" macos-diag

      - name: let the container download the recovery image
        run: |
          set -eux
          V="${{ matrix.version }}"
          mkdir -p "$GITHUB_WORKSPACE/storage"

          sudo docker run -d --name dlg \
            --device=/dev/kvm \
            -e VERSION="$V" -e DISK_SIZE=64G -e RAM_SIZE=8G -e CPU_CORES=4 \
            -e MANUAL=Y \
            -v "$GITHUB_WORKSPACE/storage:/storage" \
            macos-diag

          # setup.dmg appears once the download finishes, which is several minutes; the
          # other assets arrive alongside it. Only the dmg is needed here.
          for i in $(seq 1 180); do
            if [ -s "storage/$V/setup.dmg" ]; then
              echo "setup.dmg present after $((i*5))s"
              break
            fi
            echo "[$((i*5))s] waiting"
            sleep 5
          done
          ls -la "storage/$V/" || true
          sudo docker rm -f dlg >/dev/null 2>&1 || true

      # THE COMPARATIVE QUESTION.
      #
      # patch.py succeeds on the 14 image and fails on the 15 image with
      # "Expected exactly one rc.cdrom.sh bootstrap, found 0". Two possible causes, and
      # they need different fixes:
      #
      #   the text of rc.cdrom.sh changed between releases   -> new needle
      #   the DMG no longer stores that file where it did    -> different approach entirely
      #
      # Running the same three searches over both images distinguishes them. The first is
      # SCRIPT_ORIGINAL's own opening line, which is what patch.py looks for; the second
      # is a word the script contains but which also appears in binaries; the third is the
      # bootstrap the patch writes in, in case an image is already patched.
      - name: search both images for the same three strings
        run: |
          set -ux
          V="${{ matrix.version }}"
          SRC="storage/$V/setup.dmg"
          [ -s "$SRC" ] || { echo "::error::no setup.dmg"; exit 1; }
          ls -la "$SRC"

          echo "########## version $V ##########"

          echo "===== 1. SCRIPT_ORIGINAL opening line ====="
          python3 src/install/recovery/patch.py --dump "$SRC" \
            'launchd passes the "boot mode" to us' > /tmp/d1.txt 2>&1 || true
          tail -3 /tmp/d1.txt

          echo "===== 2. the word the script contains ====="
          python3 src/install/recovery/patch.py --dump "$SRC" 'diskarbitrationd' > /tmp/d2.txt 2>&1 || true
          tail -3 /tmp/d2.txt

          echo "===== 3. rc.cdrom.sh itself ====="
          python3 src/install/recovery/patch.py --dump "$SRC" 'rc.cdrom.sh' > /tmp/d3.txt 2>&1 || true
          tail -3 /tmp/d3.txt

          echo "===== 4. mount_9p installstate (what the patch writes) ====="
          python3 src/install/recovery/patch.py --dump "$SRC" 'mount_9p' > /tmp/d4.txt 2>&1 || true
          tail -3 /tmp/d4.txt

          {
            echo "########## version $V ##########"
            for f in /tmp/d1.txt /tmp/d2.txt /tmp/d3.txt /tmp/d4.txt; do
              echo "----- $f -----"
              cat "$f"
            done
          } > "/tmp/dump-$V.txt"
          wc -c "/tmp/dump-$V.txt"

      - name: keep the extraction
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-context-${{ matrix.version }}
          path: |
            /tmp/dump-*.txt
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
